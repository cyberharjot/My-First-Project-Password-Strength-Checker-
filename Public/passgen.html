    <div class="container">
        <h1>Password Generator</h1>
        <label for="length">Password Length:</label>
        <input type="number" id="length" min="4" max="32" value="12">

        <div class="options">
            <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
            <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
            <label><input type="checkbox" id="numbers" checked> Numbers</label>
            <label><input type="checkbox" id="symbols" checked> Symbols</label>
        </div>

        <button onclick="generatePassword()">Generate Password</button>

        <div id="result"></div>
        <div class="copy-btn">
            <button onclick="copyPassword()">Copy</button>
        </div>
    </div>

    <script>
        function generatePassword() {
            const length = document.getElementById("length").value;
            const upper = document.getElementById("uppercase").checked;
            const lower = document.getElementById("lowercase").checked;
            const number = document.getElementById("numbers").checked;
            const symbol = document.getElementById("symbols").checked;

            const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const lowerChars = "abcdefghijklmnopqrstuvwxyz";
            const numberChars = "0123456789";
            const symbolChars = "!@#$%^&*()_+[]{}|;:,.<>?";

            let allChars = "";
            if (upper) allChars += upperChars;
            if (lower) allChars += lowerChars;
            if (number) allChars += numberChars;
            if (symbol) allChars += symbolChars;

            if (allChars === "") {
                document.getElementById("result").innerText = "Please select at least one option.";
                return;
            }

            let password = "";
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * allChars.length);
                password += allChars[randomIndex];
            }

            document.getElementById("result").innerText = password;
        }

        function copyPassword() {
            const result = document.getElementById("result").innerText;
            if (!result) return;
            navigator.clipboard.writeText(result).then(() => {
                alert("Password copied to clipboard!");
            });
        }
    </script>
