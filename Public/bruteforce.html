<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brute Force Simulation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bruteforce.css">
</head>
<body>

  <div class="brute-force-container" style="margin: 60px auto; max-width: 400px;">
    <h3>Brute Force Simulation</h3>

    <label for="selectUser">Select Username from Database</label>
    <select id="selectUser">
      <option value="">-- Choose a username --</option>
    </select>

    <label for="customUser">Or Enter Custom Username</label>
    <input type="text" id="customUser" placeholder="Enter custom username" />

    <button type="button">Start Brute Force</button>
  </div>
<script src="bruteforce.js" defer></script>

</body>
</html>
