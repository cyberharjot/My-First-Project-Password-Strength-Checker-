<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Secure Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bruteforce.css">
</head>
<body>

  <div class="login-container">
    <form class="login-form">
      <h2>Login</h2>

      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit">Sign In</button>

      <div class="footer">
        <span>Don't have Account?</span>
        <a href="bruteforcesignup.html">Sign Up</a>
      </div>
    </form>
  </div>
  <div class="brute-force-link-bottom">
  <a href="bruteforce.html">
    <button>Brute Force Simulation</button>
  </a>
  <a href="index.html">
    <button>Go to Home</button>
  </a>
</div>
<script src="bruteforce.js" defer></script>

</body>
</html>
